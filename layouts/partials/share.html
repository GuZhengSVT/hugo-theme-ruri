{{ if .Site.Params.share }}{{ $links := partial "helpers/shareLink.html" . }}<div class="share-links"><span>{{ i18n "share" }}</span>{{ range .Site.Params.share }}{{ if eq . "weixin" }}<button class="share-weixin" data-url="{{ $.Permalink }}" data-title="{{ $.Title }}">WeChat · {{ i18n "share" }}</button>{{ else }}<a href="{{ index $links . }}" target="_blank" rel="noopener noreferrer">{{ . }}</a>{{ end }}{{ end }}</div>
{{ end }}
