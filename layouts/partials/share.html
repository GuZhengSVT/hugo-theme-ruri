{{ if .Site.Params.share }}{{ $links := partial "helpers/shareLink.html" . }}<div class="share-links"><span>{{ i18n "share" }}</span>{{ range .Site.Params.share }}{{ if eq . "weixin" }}<button class="copy-link" data-url="{{ $.Permalink }}">WeChat · {{ i18n "ruri_copy_link" }}</button>{{ else }}<a href="{{ index $links . }}" target="_blank" rel="noopener noreferrer">{{ . }}</a>{{ end }}{{ end }}</div>
{{ end }}
