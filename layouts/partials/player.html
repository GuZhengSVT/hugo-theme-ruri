<section id="floating-player" data-enabled="{{ ne .Site.Params.player.enable false }}" data-fallback="{{ "ruri/cover.svg" | relURL }}" hidden aria-label="{{ i18n "ruri_player" }}" data-ruri-label="player" data-api="{{ .Site.Params.player.meting.meting_api }}" data-id="{{ .Site.Params.player.meting.options.id }}" data-server="{{ .Site.Params.player.meting.options.server }}" data-type="{{ .Site.Params.player.meting.options.type }}" data-audio="{{ .Site.Params.player.aplayer.options.audio | jsonify }}">
  <div class="player-artwork"><button id="player-toggle" type="button" aria-label="{{ i18n "ruri_play_music" }}" data-ruri-label="play_music" aria-pressed="false"><img id="music-cover" alt="{{ i18n "ruri_cover" }}" width="104" height="104"></button><button id="cover-state" type="button" aria-label="{{ i18n "ruri_play_music" }}" data-ruri-label="play_music" aria-pressed="false" title="{{ i18n "ruri_play_music" }}"><svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div>
  <div class="player-body">
    <div class="music-title-window"><span id="music-title"></span></div>
    <audio id="music-audio" preload="none"></audio>
    <div class="music-progress"><span id="music-elapsed">0:00</span><input id="music-seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="{{ i18n "ruri_progress" }}" data-ruri-label="progress"><span id="music-duration">0:00</span></div>
    <div class="music-controls">
      <button id="music-prev" type="button" aria-label="{{ i18n "ruri_prev_track" }}" data-ruri-label="prev_track" title="{{ i18n "ruri_prev_track" }}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14m14-14L8 12l11 7Z"/></svg></button>
      <button id="music-play" type="button" aria-label="{{ i18n "ruri_play" }}" data-ruri-label="play" title="{{ i18n "ruri_play" }}"><svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <button id="music-next" type="button" aria-label="{{ i18n "ruri_next_track" }}" data-ruri-label="next_track" title="{{ i18n "ruri_next_track" }}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button>
      <button id="music-order" type="button" title="{{ i18n "ruri_order" }}" aria-label="{{ i18n "ruri_order" }}" data-ruri-label="order" data-order="sequence"><svg data-order-icon="sequence" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 13v3a2 2 0 0 1-2 2H3"/></svg><svg data-order-icon="single" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 13v3a2 2 0 0 1-2 2H3"/><path d="m10 10 2-1v6m-2 0h4"/></svg><svg data-order-icon="shuffle" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h3c5 0 7 14 12 14h3m-4-4 4 4-4 4M3 19h3c2 0 3-2 4-4m4-6c1-2 2-4 4-4h3m-4-4 4 4-4 4"/></svg></button>
      <button id="music-lyrics-toggle" type="button" aria-pressed="true" title="{{ i18n "ruri_lyrics" }}" aria-label="{{ i18n "ruri_lyrics" }}" data-ruri-label="lyrics"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h6"/></svg></button>
      <button id="music-volume-toggle" type="button" aria-label="{{ i18n "ruri_volume_settings" }}" data-ruri-label="volume_settings" title="{{ i18n "ruri_volume_settings" }}" aria-expanded="false" aria-controls="music-volume-panel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><path class="volume-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="volume-cross" d="m16 9 5 6m0-6-5 6"/></svg></button>
      <button id="music-list-toggle" type="button" aria-expanded="false" aria-controls="music-playlist" title="{{ i18n "ruri_list_toggle" }}" aria-label="{{ i18n "ruri_list_toggle" }}" data-ruri-label="list_toggle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h13M3 10h10M3 15h7M18 10v9m0-9 4-1v7"/><ellipse cx="15.5" cy="19" rx="2.5" ry="2"/></svg></button>
    </div>
  </div>
  <div id="music-volume-panel" hidden><button id="music-mute" type="button" aria-label="{{ i18n "ruri_mute" }}" data-ruri-label="mute" title="{{ i18n "ruri_mute" }}" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><path class="volume-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="volume-cross" d="m16 9 5 6m0-6-5 6"/></svg></button><input id="music-volume" type="range" min="0" max="100" step="1" value="100" aria-label="{{ i18n "ruri_volume" }}" data-ruri-label="volume"><output id="music-volume-value" for="music-volume">100%</output></div>
  <section id="music-playlist" hidden aria-label="{{ i18n "ruri_playlist" }}" data-ruri-label="playlist">
    <header><strong>{{ i18n "ruri_playlist_title" }} <small id="music-count"></small></strong><button id="music-list-close" type="button" aria-label="{{ i18n "ruri_list_close" }}" data-ruri-label="list_close">×</button></header>
    <p id="music-feedback" role="status"></p>
    <ol id="music-tracks" aria-label="{{ i18n "ruri_choose_track" }}" data-ruri-label="choose_track"></ol>
  </section>
</section>
<div id="music-lyrics" hidden aria-label="{{ i18n "ruri_current_lyrics" }}" data-ruri-label="current_lyrics"><span class="lyric-original"></span><span class="lyric-translation" hidden></span></div>
