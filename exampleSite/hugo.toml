[params]
author = "Your Name"
description = "Notes, ideas, and everyday life."
mainSections = ["posts"]
[[params.menu]]
name = "home"
url = "/"
[[params.menu]]
name = "archives"
url = "/archives/"
[[params.menu]]
name = "about"
url = "/about/"
